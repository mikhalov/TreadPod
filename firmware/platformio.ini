[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.5.0
build_flags = -std=gnu++17
build_unflags = -std=gnu++11 -std=gnu++2a -std=gnu++2b

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -DUNITY_INCLUDE_DOUBLE
